name: Countertop CI and deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.package.outputs.digest }}
      artifact_name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the production application
        run: pnpm build
      - name: Verify and package the production bundle
        id: package
        run: |
          python3 deploy/bundle.py dist countertop.zip "$GITHUB_SHA"
          sha256sum countertop.zip | awk '{print "digest="$1}' >> "$GITHUB_OUTPUT"
          echo "name=countertop-release-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Install loopback test dependencies
        run: |
          pnpm exec playwright install --with-deps chromium --only-shell
          sudo apt-get update
          sudo apt-get install -y nginx python3-paramiko bubblewrap
      - name: Check restricted SSH login and transaction recovery units
        run: |
          bash tests/login_smoke.sh
          systemd-analyze verify deploy/countertop-recover.{path,service}
      - name: Test release integrity, host pinning, activation, recovery and retention
        run: /usr/bin/python3 tests/test_release.py
      - name: Run the packaged HTTPS smoke and five standalone Chromium suites
        run: python3 tests/nginx_smoke.py countertop.zip "$GITHUB_SHA"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: countertop.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: check
    if: github.repository == 'nbuzzerio/CookBook' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: recipes-production
      url: https://www.nickbuzzerio.com/apps/recipes/
    concurrency:
      group: recipes-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.check.outputs.artifact_name }}
          path: ${{ runner.temp }}/countertop-artifact
      - name: Publish checked bytes and verify the public HTTPS release
        env:
          RECIPES_DEPLOY_KEY: ${{ secrets.RECIPES_DEPLOY_KEY }}
          RECIPES_SSH_HOST: ${{ vars.RECIPES_SSH_HOST }}
          RECIPES_SSH_PORT: ${{ vars.RECIPES_SSH_PORT }}
          RECIPES_SSH_HOST_KEY: ${{ vars.RECIPES_SSH_HOST_KEY }}
          ARTIFACT_SHA256: ${{ needs.check.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/publish.sh "$RUNNER_TEMP/countertop-artifact/countertop.zip"
