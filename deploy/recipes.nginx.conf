# Include inside the existing canonical www HTTPS server block.
# Test the original request before location selection on the normalized URI.
if ($request_uri ~* "^/apps/recipes(?=/|%2f)[^?]*(?:/|%2f)(?:\.|%2e){2}(?:/|%2f|\?|$)") { return 404; }
location = /apps/recipes {
    return 308 /apps/recipes/$is_args$args;
}
location ^~ /apps/recipes/ {
    alias /var/www/countertop/current/;
    open_file_cache off;
    etag off;
    if_modified_since off;
    disable_symlinks on from=/var/www/countertop/current;
    index index.html;
    autoindex off;
    limit_except GET { deny all; }
    # Restrict the URL surface as well as the on-disk archive inventory.
    if ($uri !~ "^/apps/recipes/(?:index\.html|sw\.js|release\.json|manifest\.webmanifest|favicon\.svg|(?:recipe|collection)\.schema\.json|examples/recipe\.json|licenses/[a-z-]+\.txt|assets/images/[a-z0-9][a-z0-9-]*\.jpg|assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?))?$") { return 404; }
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/jpeg jpg;
        font/woff woff;
        font/woff2 woff2;
        text/plain txt;
    }
    # Keep the existing server's security headers, including nosniff.
    set $recipes_expires -1;
    if ($uri ~ "^/apps/recipes/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?)$") { set $recipes_expires 365d; }
    expires $recipes_expires;
}
